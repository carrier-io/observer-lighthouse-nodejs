name: Docker Image CI
 
on:
  create:
    tags:
      - '*'
  push:
    branches: [ ibombit_updated_v13.0.3 ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    -
        name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}
    -
       name: Build
       run: |
          docker build -t getcarrier/observer-lighthouse-nodejs:latest-alpine_v13.0.3 .
    -
       name: Push
       run: |
         docker push getcarrier/observer-lighthouse-nodejs:latest-alpine_v13.0.3
